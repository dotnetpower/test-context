[package]
name = "test-context"
version = "0.1.2"
edition = "2024"
description = "Shared local Rust Python AST dependency graph, speculative background pytest runner, and incremental test cache for AI coding agents"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
memchr = "2"
notify = "8"
globset = "0.4"
fs2 = "0.4"
libc = "0.2"
bincode = "1.3"

[[bin]]
name = "tctx"
path = "src/main.rs"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
incremental = true
strip = "symbols"
